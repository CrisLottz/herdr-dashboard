id = "herdr-dashboard"
name = "herdr-dashboard"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Live sidebar: agents' CPU/RAM, dev ports, git worktrees and system stats"
platforms = ["linux", "macos", "windows"]

# Every command goes through bootstrap.py, the same argv on every OS: it creates
# the private .venv on first use and then runs `python -m hdash <command>` in it.
[[build]]
command = ["python", "bootstrap.py", "--install"]

# Full system dashboard as a floating popup: no space in the tiled layout; q/Esc closes it.
[[panes]]
id = "system"
title = "herdr-dashboard"
placement = "popup"
width = "70%"
height = "80%"
command = ["python", "bootstrap.py", "system"]

[[actions]]
id = "toggle-sidebar"
title = "Toggle dashboard sidebar"
contexts = ["workspace"]
command = ["python", "bootstrap.py", "toggle-sidebar"]

[[actions]]
id = "open-system"
title = "Open system dashboard popup"
contexts = ["workspace"]
command = ["python", "bootstrap.py", "open-popup"]

[[actions]]
id = "toggle-strip"
title = "Toggle system strip"
contexts = ["workspace"]
command = ["python", "bootstrap.py", "toggle-strip"]
